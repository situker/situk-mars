<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1160" viewBox="0 0 900 1160" role="img" aria-labelledby="title desc">
<title id="title">situk-MARS first run: three steps to results</title>
<desc id="desc">Download and unzip the English pack, run one Python command from situk-mars, then open the weekly report, pending-review list and team-role observations in the new output folder. All materials are fictional. No live bot or routine changes.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8496aa"/></marker></defs>
<rect width="900" height="1160" fill="#f4f7fb"/>
<g font-family="Segoe UI, Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif">
<text x="40" y="52" font-size="24" font-weight="700" fill="#446583">situk-MARS</text>
<text x="40" y="105" font-size="38" font-weight="700" fill="#142b47">Your first run: three steps to results</text>
<text x="40" y="151" font-size="27" fill="#4a6078">Rehearse with a fictional team. See whether it helps.</text>
<rect x="24" y="190" width="852" height="190" rx="20" fill="#ffffff" stroke="#d6e1ed" stroke-width="2"/>
<circle cx="67" cy="238" r="25" fill="#163e61"/>
<text x="67" y="248" text-anchor="middle" font-size="29" font-weight="700" fill="#ffffff">1</text>
<text x="108" y="249" font-size="32" font-weight="700" fill="#142b47">Download the English pack and unzip</text>
<text x="48" y="306" font-size="28" font-weight="500" fill="#405b75">situk-mars-v0.2.0-en.zip</text>
<text x="48" y="351" font-size="28" fill="#405b75">Open a terminal inside the situk-mars folder.</text>
<path d="M 450 386 V 413" fill="none" stroke="#8496aa" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="24" y="420" width="852" height="180" rx="20" fill="#ffffff" stroke="#d6e1ed" stroke-width="2"/>
<circle cx="67" cy="468" r="25" fill="#163e61"/>
<text x="67" y="478" text-anchor="middle" font-size="29" font-weight="700" fill="#ffffff">2</text>
<text x="108" y="479" font-size="32" font-weight="700" fill="#142b47">Run one command</text>
<rect x="48" y="512" width="804" height="62" rx="10" fill="#eaf1f8"/>
<text x="62" y="552" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="24" font-weight="500" fill="#173b5c">python -B scripts/simulate.py --output ../mars-demo-new</text>
<path d="M 450 606 V 633" fill="none" stroke="#8496aa" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="24" y="640" width="852" height="275" rx="20" fill="#ffffff" stroke="#d6e1ed" stroke-width="2"/>
<circle cx="67" cy="688" r="25" fill="#163e61"/>
<text x="67" y="698" text-anchor="middle" font-size="29" font-weight="700" fill="#ffffff">3</text>
<text x="108" y="699" font-size="32" font-weight="700" fill="#142b47">Open mars-demo-new</text>
<text x="48" y="749" font-size="27" fill="#4a6078">Start with the weekly report:</text>
<text x="48" y="797" font-size="34" font-weight="700" fill="#176950">06-weekly-report.md</text>
<text x="48" y="850" font-size="28" fill="#4a6078">Then 06-pending-review.md</text>
<text x="48" y="890" font-size="28" fill="#4a6078">and 06-team-observations.md</text>
<text x="40" y="967" font-size="26" fill="#526b83">Python 3.11+ · Standard library only · No account or API key</text>
<text x="40" y="1007" font-size="26" fill="#526b83">Do not pre-create the output folder. If it exists, use a new name.</text>
<text x="40" y="1061" font-size="26" font-weight="500" fill="#526b83">All inputs, evidence and approvals are fictional.</text>
<text x="40" y="1101" font-size="26" font-weight="500" fill="#526b83">No live bot or routine changes.</text>
</g>
</svg>
