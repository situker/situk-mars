<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">A week of work, ready for your review</title>
<desc id="desc">A compact preview of three fictional exercise documents. Recorded totals: Example Writer 4.80 and Example Builder 9.20. The writer receives Private First Class only after a separate simulated approval. Pending items include missing adoption evidence and the Merit Officer&#x27;s approved but unrecorded 1 point; neither adds to recorded totals. Reuse the accepted checklist before proposing new roles. This is a document preview, not an application interface. No live bots or routines are changed.</desc>
<style>text{font-family:"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#18332e}.heading{font-weight:700}.muted{fill:#536760}.green{fill:#126650}.amber{fill:#80551a}</style>
