<text x="56" y="375" font-size="18" class="amber">与普通阶梯分开</text>
<text x="350" y="348" font-size="20" class="amber">0–1 席 · 仅统筹者 · 人类任命</text>
<text x="350" y="374" font-size="20" class="muted">不加分、不自批，不改变普通军衔与在阶起算。</text>
