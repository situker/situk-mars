<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1215" viewBox="0 0 1440 1215" role="img" aria-labelledby="title desc">
<title id="title">situk-MARS</title><desc id="desc">Claims, independent review, human approval, formal recording, separate rank decisions and weekly reporting. Marshal is a separate appointment.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6c7e96"/></marker></defs>
<rect width="1440" height="1215" fill="#f5f7fb"/>
<g font-family="Segoe UI, Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif">
<text x="80" y="71" font-size="34" font-weight="700" fill="#142b47" text-anchor="start">situk-MARS</text>
<text x="80" y="107" font-size="20" font-weight="400" fill="#566b85" text-anchor="start">Situk Merit-based Agent Rank System · v0.2.0 · Document workflow</text>
<rect x="460" y="145" width="520" height="106" rx="18" fill="#153757" stroke="#153757" stroke-width="1.5"/>
<text x="720" y="184" font-size="25" font-weight="700" fill="#ffffff" text-anchor="middle">Human Owner</text>
<text x="720" y="220" font-size="19" font-weight="400" fill="#e0eafb" text-anchor="middle">Defines scope and rules; approves exact changes</text>
<path d="M 580 251 V 281 H 380 V 315" fill="none" stroke="#6c7e96" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1060 315 V 281 H 860 V 251" fill="none" stroke="#6c7e96" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="380" y="272" font-size="17" font-weight="600" fill="#566b85" text-anchor="middle">Exact approval</text>
<text x="1060" y="272" font-size="17" font-weight="600" fill="#566b85" text-anchor="middle">Proposals and conflicts</text>
<rect x="80" y="315" width="600" height="142" rx="18" fill="#ffffff" stroke="#d8e0eb" stroke-width="1.5"/>
<rect x="760" y="315" width="600" height="142" rx="18" fill="#ffffff" stroke="#d8e0eb" stroke-width="1.5"/>
<text x="110" y="356" font-size="25" font-weight="700" fill="#153757" text-anchor="start">Commander</text>
<text x="110" y="394" font-size="19" font-weight="400" fill="#24364d" text-anchor="start">Collects claims and preserves original versions</text>
<text x="110" y="424" font-size="19" font-weight="400" fill="#24364d" text-anchor="start">Sole formal recorder; checks each exact human approval</text>
<text x="790" y="356" font-size="25" font-weight="700" fill="#153757" text-anchor="start">Merit Officer</text>
<text x="790" y="394" font-size="19" font-weight="400" fill="#24364d" text-anchor="start">Reviews evidence and caps; reconciles and reports</text>
<text x="790" y="424" font-size="19" font-weight="400" fill="#24364d" text-anchor="start">Escalates self/shared conflicts; never writes the ledger</text>
<rect x="80" y="510" width="1280" height="82" rx="18" fill="#e9f1fb" stroke="#bfd3ec" stroke-width="1.5"/>
<text x="110" y="544" font-size="22" font-weight="700" fill="#153757" text-anchor="start">Business bots</text>
<text x="110" y="576" font-size="19" font-weight="400" fill="#24364d" text-anchor="start">Deliver work and evidence; submit original claims. Job roles and ordinary ranks remain separate.</text>
<path d="M 179 592 V 680" fill="none" stroke="#6c7e96" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="720" y="644" font-size="23" font-weight="700" fill="#153757" text-anchor="middle">One complete award cycle</text>
<rect x="80" y="680" width="198" height="136" rx="14" fill="#ffffff" stroke="#d8e0eb" stroke-width="1.5"/>
<circle cx="105" cy="708" r="12" fill="#153757"/>
<text x="105" y="713" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="179" y="746" font-size="21" font-weight="700" fill="#153757" text-anchor="middle">Claim</text>
<text x="179" y="776" font-size="16" font-weight="400" fill="#465c76" text-anchor="middle">Business bots</text>
<text x="179" y="800" font-size="16" font-weight="400" fill="#465c76" text-anchor="middle">Work and evidence</text>
<path d="M 278 748 H 294" fill="none" stroke="#6c7e96" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="296" y="680" width="198" height="136" rx="14" fill="#ffffff" stroke="#d8e0eb" stroke-width="1.5"/>
<circle cx="321" cy="708" r="12" fill="#153757"/>
<text x="321" y="713" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="395" y="746" font-size="21" font-weight="700" fill="#153757" text-anchor="middle">Review</text>
<text x="395" y="776" font-size="16" font-weight="400" fill="#465c76" text-anchor="middle">Merit Officer</text>
<text x="395" y="800" font-size="16" font-weight="400" fill="#465c76" text-anchor="middle">Evidence, shares, caps</text>
<path d="M 494 748 H 510" fill="none" stroke="#6c7e96" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="512" y="680" width="198" height="136" rx="14" fill="#fff0d8" stroke="#e5b65d" stroke-width="1.5"/>
<circle cx="537" cy="708" r="12" fill="#153757"/>
<text x="537" y="713" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="611" y="746" font-size="21" font-weight="700" fill="#153757" text-anchor="middle">Approve</text>
<text x="611" y="776" font-size="16" font-weight="400" fill="#465c76" text-anchor="middle">Human Owner</text>
<text x="611" y="800" font-size="16" font-weight="400" fill="#465c76" text-anchor="middle">Exact items and version</text>
<path d="M 710 748 H 726" fill="none" stroke="#6c7e96" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="728" y="680" width="198" height="136" rx="14" fill="#ffffff" stroke="#d8e0eb" stroke-width="1.5"/>
<circle cx="753" cy="708" r="12" fill="#153757"/>
<text x="753" y="713" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="827" y="746" font-size="21" font-weight="700" fill="#153757" text-anchor="middle">Record</text>
<text x="827" y="776" font-size="16" font-weight="400" fill="#465c76" text-anchor="middle">Commander</text>
<text x="827" y="800" font-size="16" font-weight="400" fill="#465c76" text-anchor="middle">Record once; reconcile</text>
<path d="M 926 748 H 942" fill="none" stroke="#6c7e96" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="944" y="680" width="198" height="136" rx="14" fill="#ffffff" stroke="#d8e0eb" stroke-width="1.5"/>
<circle cx="969" cy="708" r="12" fill="#153757"/>
<text x="969" y="713" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="1043" y="746" font-size="21" font-weight="700" fill="#153757" text-anchor="middle">Confer rank</text>
<text x="1043" y="776" font-size="16" font-weight="400" fill="#465c76" text-anchor="middle">Separate approval</text>
<text x="1043" y="800" font-size="16" font-weight="400" fill="#465c76" text-anchor="middle">Candidate is not a rank</text>
<path d="M 1142 748 H 1158" fill="none" stroke="#6c7e96" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1160" y="680" width="198" height="136" rx="14" fill="#ffffff" stroke="#d8e0eb" stroke-width="1.5"/>
<circle cx="1185" cy="708" r="12" fill="#153757"/>
<text x="1185" y="713" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<text x="1259" y="746" font-size="21" font-weight="700" fill="#153757" text-anchor="middle">Report</text>
<text x="1259" y="776" font-size="16" font-weight="400" fill="#465c76" text-anchor="middle">Merit Officer</text>
<text x="1259" y="800" font-size="16" font-weight="400" fill="#465c76" text-anchor="middle">Recorded vs. pending</text>
<text x="720" y="850" font-size="18" font-weight="400" fill="#566b85" text-anchor="middle">Missing evidence stays pending. Over-cap shares record zero. Points and time create candidates.</text>
<rect x="80" y="890" width="1280" height="134" rx="18" fill="#edf2f8" stroke="#d3deeb" stroke-width="1.5"/>
<text x="110" y="924" font-size="22" font-weight="700" fill="#153757" text-anchor="start">Customer-authorized runtime documents</text>
<rect x="110" y="947" width="230" height="50" rx="10" fill="#ffffff" stroke="#d3deeb" stroke-width="1.5"/>
<text x="225" y="978" font-size="18" font-weight="600" fill="#365574" text-anchor="middle">Roster</text>
<rect x="360" y="947" width="230" height="50" rx="10" fill="#ffffff" stroke="#d3deeb" stroke-width="1.5"/>
<text x="475" y="978" font-size="18" font-weight="600" fill="#365574" text-anchor="middle">Claims and reviews</text>
<rect x="610" y="947" width="230" height="50" rx="10" fill="#ffffff" stroke="#d3deeb" stroke-width="1.5"/>
<text x="725" y="978" font-size="18" font-weight="600" fill="#365574" text-anchor="middle">Human decisions</text>
<rect x="860" y="947" width="230" height="50" rx="10" fill="#ffffff" stroke="#d3deeb" stroke-width="1.5"/>
<text x="975" y="978" font-size="18" font-weight="600" fill="#365574" text-anchor="middle">Ledger and ranks</text>
<rect x="1110" y="947" width="230" height="50" rx="10" fill="#ffffff" stroke="#d3deeb" stroke-width="1.5"/>
<text x="1225" y="978" font-size="18" font-weight="600" fill="#365574" text-anchor="middle">Weekly and pending</text>
<text x="80" y="1065" font-size="21" font-weight="700" fill="#153757" text-anchor="start">Marshal: separate special appointment, 0–1 seat; no points, rank reset or self-approval.</text>
<text x="80" y="1107" font-size="18" font-weight="400" fill="#566b85" text-anchor="start">Optional Python checks arithmetic and consistency; it cannot authenticate people or real evidence.</text>
<text x="80" y="1138" font-size="18" font-weight="400" fill="#566b85" text-anchor="start">Portable rules and templates. This version does not create bots, rename profiles or configure routines.</text>
</g></svg>
