<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1210" viewBox="0 0 760 1210" role="img" aria-labelledby="title desc">
<title id="title">See what one exercise produces</title>
<desc id="desc">A reformatted preview of three local exercise documents and their fictional input: writer 4.80 points, builder 9.20, missing adoption evidence, an approved but unrecorded 1-point item, and reuse of an accepted checklist without automatic bot creation.</desc>
<style>text{font-family:Inter,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#152b32} .muted{fill:#536a72} .heading{font-weight:700} .mono{font-family:"Cascadia Code",Consolas,"Microsoft YaHei",monospace} .green{fill:#0d715d} .amber{fill:#92620a}</style>
<rect width="760" height="1210" rx="24" fill="#f2f6f6"/>
<rect x="40" y="34" width="5" height="112" rx="2" fill="#167f6a"/>
<text x="61" y="54" font-size="18" class="heading green">SITUK-MARS / EXERCISE PREVIEW</text>
<text x="61" y="104" font-size="36" class="heading">See what one exercise produces</text>
<text x="61" y="144" font-size="24" class="muted">Three documents to see results and next actions.</text>
<rect x="40" y="177" width="680" height="300" rx="18" fill="#ffffff" stroke="#d8e3e4"/>
<rect x="60" y="198" width="45" height="38" rx="10" fill="#e0f3ee"/>
<text x="82" y="225" font-size="23" class="heading green" text-anchor="middle">01</text>
<text x="120" y="225" font-size="30" class="heading">Weekly merit report</text>
<text x="64" y="257" font-size="20" class="muted mono">06-weekly-report.md · formal points</text>
<line x1="64" y1="273" x2="696" y2="273" stroke="#e5ebec"/>
<text x="64" y="314" font-size="26" class="heading">Example Writer</text>
<text x="690" y="317" font-size="42" class="heading green" text-anchor="end">4.80</text>
<text x="64" y="350" font-size="22" class="muted">Private → Private First Class · separately approved</text>
<text x="64" y="400" font-size="26" class="heading">Example Builder</text>
<text x="690" y="403" font-size="42" class="heading green" text-anchor="end">9.20</text>
<text x="64" y="436" font-size="22" class="muted">Remains Private · promotion needs its own approval</text>
<text x="64" y="463" font-size="19" class="muted">Merit: W43 · rank change effective: W44</text>
<rect x="40" y="497" width="680" height="285" rx="18" fill="#ffffff" stroke="#d8e3e4"/>
<rect x="60" y="518" width="45" height="38" rx="10" fill="#fff1d7"/>
<text x="82" y="545" font-size="23" class="heading green" text-anchor="middle">02</text>
<text x="120" y="545" font-size="30" class="heading">Pending-review list</text>
<text x="64" y="577" font-size="20" class="muted mono">06-pending-review.md</text>
<line x1="64" y1="593" x2="696" y2="593" stroke="#e5ebec"/>
<text x="64" y="628" font-size="26" class="heading amber">Adoption evidence missing</text>
<text x="64" y="664" font-size="24" class="muted">Builder summary → 0 formal points</text>
<text x="64" y="716" font-size="26" class="heading amber">Approved, still unrecorded</text>
<text x="64" y="752" font-size="24" class="muted">Officer&#x27;s 1 point stays outside formal totals</text>
<rect x="40" y="802" width="680" height="285" rx="18" fill="#ffffff" stroke="#d8e3e4"/>
<rect x="60" y="823" width="45" height="38" rx="10" fill="#e0f3ee"/>
<text x="82" y="850" font-size="23" class="heading green" text-anchor="middle">03</text>
<text x="120" y="850" font-size="30" class="heading">Team-role observations</text>
<text x="64" y="882" font-size="20" class="muted mono">06-team-observations.md + exercise input</text>
<line x1="64" y1="898" x2="696" y2="898" stroke="#e5ebec"/>
<text x="64" y="934" font-size="26" class="heading green">Reuse the accepted checklist first.</text>
<text x="64" y="970" font-size="24" class="muted">Accepted in a second independent task.</text>
<text x="64" y="1022" font-size="25" class="heading">Observations stay as proposals.</text>
<text x="64" y="1058" font-size="24" class="muted">No automatic role or bot creation.</text>
<text x="380" y="1137" font-size="24" class="heading" text-anchor="middle">Fictional exercise · Local document preview</text>
<text x="380" y="1174" font-size="21" class="muted" text-anchor="middle">Not a GrokBot interface · No live bot or routine changes</text>
</svg>
