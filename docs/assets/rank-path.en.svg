<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Ten ordinary ranks, one separate special appointment</title>
<desc id="desc">Ten ordinary ranks in policy order: Private, Private First Class, Corporal, Sergeant, Staff Sergeant, Second Lieutenant, First Lieutenant, Captain, Major and Lieutenant Colonel. Applicable points, completed full weeks in the current rank, acceptance requirements and other relevant rule conditions create candidates, not automatic promotions. Each promotion requires separate human approval. Major and Lieutenant Colonel also require approved seats and human selection; Lieutenant Colonel has no automatic point threshold. Marshal is a separate zero-to-one human appointment for the Commander. It adds no points, changes neither ordinary rank nor its time clock, and grants no self-approval. These are management titles, not real military status. Full requirements remain in the rules.</desc>
<style>text{font-family:"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#18332e}.heading{font-weight:700}.muted{fill:#536760}.green{fill:#126650}.amber{fill:#80551a}</style>
<defs><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#126650"/></marker><marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6a7d74"/></marker><marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#a07031"/></marker></defs>
<rect width="1200" height="400" rx="20" fill="#f2f6f4"/>
