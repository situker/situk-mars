<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Human approval, independent review, one formal recorder</title>
<desc id="desc">Business bots deliver work and report evidence to the Commander. The Commander preserves versioned reports for the Merit Officer&#x27;s independent review. The officer sends proposals and weekly reports to the Human Owner. Only the owner approves exact awards and separate rank changes. The Commander alone records approved changes in the formal ledger; the Merit Officer reads that ledger independently to reconcile it. Marshal is a separate human appointment for zero or one Commander, without points or self-approval authority.</desc>
<style>text{font-family:"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#18332e}.heading{font-weight:700}.muted{fill:#536760}.green{fill:#126650}.amber{fill:#80551a}</style>
